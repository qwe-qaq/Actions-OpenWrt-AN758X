name: Warm Build Cache

# =========================================================
# 预热「整体构建缓存」—— 与 build-ponwrt.yml 共用 scripts/pwrt-cache.sh 的
# key 算法，所以「预热出来的」和「主流程要的」永远是同一条线下的相邻代，
# 主流程靠 restore-keys 前缀回退必定能取到。
#
#   一份缓存 = staging_dir/host* + staging_dir/tool* + .ccache
#   两条通道同一份内容：actions/cache（快、7 天回收）+ Release（慢、永久），
#   预热时两条都写，保证任一时刻两边都有东西可取。
#
#   用途：① 冷启动 —— 主流程第一次不必现编工具链
#         ② 保活 —— 定时跑一次即刷新 lastAccessedAt，避开 7 天回收
# =========================================================

on:
  workflow_dispatch:
    inputs:
      soc:
        description: '预热哪个 SoC（同 SoC 下所有机型共用一份缓存）'
        required: true
        default: 'an7581'
        type: choice
        options:
          - 'an7581'
          - 'an7583'
          - 'an7581和an7583'
      source:
        description: '编译源码仓库（需与主流程一致，否则前缀对不上）'
        required: true
        default: 'pbs05/ponwrt'
        type: choice
        options:
          - pbs05/ponwrt
          - fork
      branch:
        description: 'ponwrt 源码分支'
        required: true
        default: 'master'
      force:
        description: '忽略已有缓存，强制重编（会覆盖同一提交号那代）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      prebuilt_host:
        description: 'host 侧 go/rust/llvm 怎么来（必须与主流程一致，否则预热到另一条缓存线上）'
        required: false
        default: '预编译'
        type: choice
        options:
          - '预编译'
          - '源码编'
          - '预编译和源码编'
        # ⚠ 选「预编译和源码编」= 一次预热两条缓存线（HOST_MODE 进 key 前缀，
        #   两条线互不通用）。代价：source 那条首次要 1.5~2.5 小时、
        #   多占 1~2 GB 配额。只在你确实会在两种模式间切换时才选它。
      release_backup:
        description: '同时存一份到 Release 备份（与主流程同一个 release）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # 每周一 03:17（UTC）—— 兼作缓存保活，别删
    - cron: '17 3 * * 1'

permissions:
  # 需要 contents: write 才能创建 release / 传资产；actions: write 才能 gh cache delete
  contents: write
  actions: write

env:
  BUILD_ROOT: /workdir
  CACHE_ROOT: /workdir/openwrt
  CACHE_RELEASE: cache-backup
  # ⚠ PREBUILT_HOST / HOST_MODE 不再写在这里：它们由 build 矩阵的
  #   matrix.host_mode 决定（一次可以同时预热 prebuilt + source 两条线）。
  #   HOST_MODE 会进缓存 key 前缀，所以矩阵里只放 ASCII 的
  #   prebuilt / source，中文选项在 prepare 里就映射掉了。
  RELEASE_BACKUP: ${{ github.event.inputs.release_backup == 'false' && 'false' || 'true' }}
  SOURCE: ${{ github.event.inputs.source || 'pbs05/ponwrt' }}
  REPO_URL: ${{ github.event.inputs.source == 'fork' && 'https://github.com/qwe-qaq/ponwrt' || 'https://github.com/pbs05/ponwrt' }}
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  DIY_P1_SH: diy-part1.sh
  FORCE_REBUILD: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
  IGNORE_CACHE: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
  USE_CCACHE: false
  # 与主流程一致：ccache 上限，别让它把 10GB 配额吃光
  CCACHE_MAXSIZE: 2G
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        run: |
          SOC_IN="${{ github.event.inputs.soc }}"
          MODE_IN="${{ github.event.inputs.prebuilt_host }}"

          # 定时触发没有 inputs → 两个 SoC 都预热，但只跑预编译
          # （源码编那趟 1.5~2.5 小时，不该每周自动烧）
          [ -z "$SOC_IN" ]  && SOC_IN='an7581和an7583'
          [ -z "$MODE_IN" ] && MODE_IN='预编译'

          # 中文选项 → 矩阵用的 ASCII 标准值。
          # HOST_MODE 会进缓存 key 前缀（scripts/pwrt-cache.sh:83），
          # 中文经 slug() 会被 tr 转成一串连字符，两条线还会撞在一起，
          # 所以必须在进矩阵之前映射干净。
          case "$MODE_IN" in
            '源码编')          HM='["source"]' ;;
            '预编译和源码编')  HM='["prebuilt","source"]' ;;
            '预编译')          HM='["prebuilt"]' ;;
            # 兼容旧调用：gh workflow run -f prebuilt_host=false / both
            false|source)     HM='["source"]' ;;
            true|prebuilt)    HM='["prebuilt"]' ;;
            both)             HM='["prebuilt","source"]' ;;
            *)
              echo "::warning::未知的 prebuilt_host=$MODE_IN，按预编译处理"
              HM='["prebuilt"]'
              ;;
          esac

          case "$SOC_IN" in
            an7581)          LIST='["an7581"]' ;;
            an7583)          LIST='["an7583"]' ;;
            an7581和an7583)  LIST='["an7581","an7583"]' ;;
            both)            LIST='["an7581","an7583"]' ;;
            *)
              echo "::warning::未知的 soc=$SOC_IN，按两个都跑"
              LIST='["an7581","an7583"]'
              ;;
          esac

          # 两个维度 → GitHub 自动做笛卡尔积：
          #   an7581和an7583 × 预编译和源码编 = 4 个 job
          echo "matrix={\"soc\":$LIST,\"host_mode\":$HM}" >> "$GITHUB_OUTPUT"
          echo "SoC 列表 : $LIST"
          echo "host 模式: $HM"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 2
    env:
      SOC: ${{ matrix.soc }}
      # 由矩阵决定，一次运行可以同时跑 prebuilt 和 source 两条缓存线。
      # ⚠ HOST_MODE 会进缓存 key 前缀（见 pwrt-cache.sh），必须是 ASCII
      #   prebuilt / source；中文选项在 prepare 里映射成这两个值。
      # job 级 env 优先级高于 workflow 级，所以不必再在顶层重复声明。
      HOST_MODE: ${{ matrix.host_mode }}
      PREBUILT_HOST: ${{ matrix.host_mode == 'prebuilt' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # =========================================================
      # 环境初始化 —— 与主流程保持同一套依赖，避免「主流程能编、
      # 预热编不出来」这种只在一边复现的怪问题
      # =========================================================
      - name: Free disk space & init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install build-essential clang llvm dwarves \
            libssl-dev libelf-dev bc flex bison python3 python3-distutils \
            xz-utils tar unzip zip zstd dos2unix gettext \
            rsync file wget curl git subversion 2>/dev/null || true

          # host 加速三件套：golang / rustup / BPF 用的 clang-llvm
          sudo -E apt-get -yqq install golang-go rustup \
            libclang-dev libbpf-dev lld 2>/dev/null || \
            echo "::warning::runner 工具链未装全，host 加速会部分失效（退回源码编译）"

          which rustup >/dev/null 2>&1 && {
            rustup toolchain install stable --profile minimal 2>/dev/null || true
            rustup default stable 2>/dev/null || true
          }

          if [ -x "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" ]; then
            bash "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" || true
          else
            sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)' || true
          fi

          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq clean
          sudo -E timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir
          sudo chown "$USER":"$USER" /workdir
          df -hT /workdir; free -h

      - name: Clone source code
        run: |
          cd "$BUILD_ROOT"
          git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
          ln -sf "$CACHE_ROOT" "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          mkdir -p .ccache
          echo "commit: $(git rev-parse --short HEAD)"

      # =========================================================
      # key / 恢复 / 恢复后处理：与主流程逐字同源
      # =========================================================
      - name: Compute cache key
        id: cache-key
        run: |
          S="$GITHUB_WORKSPACE/scripts/pwrt-cache.sh"
          [ -f "$S" ] || { echo "::error::缺 $S"; exit 1; }
          dos2unix "$S" 2>/dev/null || true
          chmod +x "$S"
          bash "$S" key "$CACHE_ROOT"

      - name: Restore build cache
        id: cache-restore
        if: env.IGNORE_CACHE != 'true'
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-
          path: |
            ${{ env.CACHE_ROOT }}/.ccache
            ${{ env.CACHE_ROOT }}/staging_dir/host*
            ${{ env.CACHE_ROOT }}/staging_dir/tool*

      - name: Restore cache from Release backup
        id: release-restore
        if: >-
          env.IGNORE_CACHE != 'true'
          && env.RELEASE_BACKUP == 'true'
          && steps.cache-restore.outputs.cache-matched-key == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$CACHE_ROOT"
          PREFIX="${{ steps.cache-key.outputs.prefix }}"

          if ! gh release view "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Release $CACHE_RELEASE 不存在（首次运行）"
            exit 0
          fi

          ASSET=$(gh release view "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" \
                    --json assets -q '.assets[] | "\(.createdAt) \(.name)"' 2>/dev/null \
                  | grep " ${PREFIX}-" | sort -r | head -1 | awk '{print $2}')
          if [ -z "$ASSET" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Release 里没有 ${PREFIX}-* 的备份"
            exit 0
          fi

          echo "从 Release 取备份: $ASSET"
          which unzstd >/dev/null 2>&1 || sudo -E apt-get -yqq install zstd >/dev/null 2>&1 || true

          if gh release download "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D . \
             && bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" unpack "$CACHE_ROOT" "./$ASSET"; then
            rm -f "./$ASSET"
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "restored_key=${ASSET%.tzst}" >> "$GITHUB_OUTPUT"
            echo "✅ 已从 Release 备份恢复: $ASSET"
          else
            rm -f "./$ASSET"
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release 备份恢复失败，走真编译"
          fi

      - name: Prepare restored build cache
        if: >-
          env.IGNORE_CACHE != 'true'
          && (steps.cache-restore.outputs.cache-matched-key != ''
              || steps.release-restore.outputs.restored == 'true')
        env:
          RESTORED_FROM: ${{ steps.cache-restore.outputs.cache-matched-key || format('Release:{0}', steps.release-restore.outputs.restored_key) }}
          CACHE_EXACT: ${{ (steps.cache-restore.outputs.cache-hit == 'true' || (steps.release-restore.outputs.restored_key != '' && steps.release-restore.outputs.restored_key == steps.cache-key.outputs.key)) && 'true' || 'false' }}
        run: |
          cd "$CACHE_ROOT"
          echo "actions/cache 恢复自: ${RESTORED_FROM:-（无）}"
          echo "Release 备份恢复: ${{ steps.release-restore.outputs.restored }} / key=${{ steps.release-restore.outputs.restored_key }}"
          bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" prepare "$CACHE_ROOT"

      - name: Update & install feeds
        run: |
          cd "$CACHE_ROOT"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pull optional plugins (diy-part1.sh)
        # ⚠ warm-cache 只把 staging_dir/host* + tool* + .ccache 打进缓存，
        #   与 luci 包无关。所以 diy-part1.sh 里的 luci 拉取失败不影响本 job。
        #   但仍然要继续往下跑 —— 因为 diy-part1.sh 末尾会跑 make
        #   prepare-tmpinfo 生成 tmp/.packageinfo，后续 make defconfig
        #   需要它来解析 .config 里的 CONFIG_PACKAGE_* 符号（缺了会有
        #   "unrecognized symbol" 类警告，虽然不致命但会污染日志）。
        continue-on-error: true
        run: |
          cd "$CACHE_ROOT"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      # =========================================================
      # 用 SoC 通用配置打底（不指定机型）—— 缓存与机型无关，
      # 这里只需要一个「能通过 defconfig 的合法配置」
      # =========================================================
      - name: Load configuration
        run: |
          cd "$CACHE_ROOT"
          if [ -f "configs/${SOC}.config" ]; then
            cp "configs/${SOC}.config" .config
            echo "✅ 使用源码 configs/${SOC}.config"
          elif [ -e "$GITHUB_WORKSPACE/configs/${SOC}.config" ]; then
            cp "$GITHUB_WORKSPACE/configs/${SOC}.config" .config
            echo "✅ 使用仓库内 configs/${SOC}.config"
          else
            echo "::error::找不到 ${SOC}.config"
            exit 1
          fi
          sed -i '/CONFIG_TARGET_DEVICE_/d; /^CONFIG_TARGET_MULTI_PROFILE=/d' .config

      - name: Prepare host toolchain (Go / BPF / Python)
        if: env.PREBUILT_HOST == 'true'
        continue-on-error: true
        run: |
          cd "$CACHE_ROOT"
          S="$GITHUB_WORKSPACE/scripts/prepare-build-host.sh"
          [ -f "$S" ] || { echo "::warning::缺 $S"; exit 0; }
          dos2unix "$S" 2>/dev/null || true
          bash "$S" "$CACHE_ROOT"

      - name: Prepare Rust toolchain (prebuilt)
        if: env.PREBUILT_HOST == 'true'
        continue-on-error: true
        run: |
          cd "$CACHE_ROOT"
          S="$GITHUB_WORKSPACE/scripts/prepare-rust.sh"
          [ -f "$S" ] || { echo "::warning::缺 $S"; exit 0; }
          dos2unix "$S" 2>/dev/null || true
          bash "$S" "$CACHE_ROOT"

      - name: Re-run defconfig
        run: |
          cd "$CACHE_ROOT"
          # 同 build-ponwrt.yml：不要用 `make defconfig 2>&1 | tail -5`
          # （管道会把失败吞成 0）。脚本内部失败即 exit 1。
          S="$GITHUB_WORKSPACE/scripts/defconfig.sh"
          [ -f "$S" ] || { echo "::error::缺 $S"; exit 1; }
          dos2unix "$S" 2>/dev/null || true
          bash "$S" "$CACHE_ROOT"

          # prepare-build-host.sh 的注入项在 defconfig 后是否还活着：
          # 被冲掉就等于那几招全白做，只剩「跑过了但没生效」。
          # source 模式本来就不该有这两个符号，所以只在 prebuilt 下检查。
          if [ "${PREBUILT_HOST:-true}" = "true" ]; then
            for k in GOLANG_EXTERNAL_BOOTSTRAP_ROOT BPF_TOOLCHAIN_HOST; do
              if grep -q "^CONFIG_${k}=" .config; then
                echo "✅ $k 保留: $(grep -m1 "^CONFIG_${k}=" .config)"
              else
                echo "::warning::$k 在 defconfig 后消失 —— host 加速未生效，会退回源码编译"
              fi
            done
          fi

      # =========================================================
      # 只有真没命中才编；命中（含前缀回退命中）就整段跳过
      # =========================================================
      - name: Download toolchain sources
        if: >-
          env.IGNORE_CACHE == 'true'
          || (steps.cache-restore.outputs.cache-matched-key == ''
              && steps.release-restore.outputs.restored != 'true')
        run: |
          cd "$CACHE_ROOT"
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试: tools/toolchain download ====="
            make tools/download toolchain/download -j8 && break
            sleep 5
          done
          find dl -size -1024c -type f -exec rm -f {} \; 2>/dev/null || true
          echo "dl 目录共 $(ls -1 dl 2>/dev/null | wc -l) 个文件"

      - name: Build tools & toolchain
        id: toolchain
        if: >-
          env.IGNORE_CACHE == 'true'
          || (steps.cache-restore.outputs.cache-matched-key == ''
              && steps.release-restore.outputs.restored != 'true')
        run: |
          cd "$CACHE_ROOT"
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s || {
            echo "::error::tools 编译失败"; exit 1; }
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s || {
            echo "::error::toolchain 编译失败"; exit 1; }
          # 只写 tmp/.build；别 touch tools/stamp-compile（那是 make 变量不是文件，
          # 造空文件会被 timestamp.pl 当成源码更新，下一轮白重编）
          mkdir -p tmp && echo 1 > tmp/.build

      # =========================================================
      # source 模式：把 golang / rust 也从源码编出来
      #
      #   它们不是 tools，`make tools/install` 不含它们；不在这里编，
      #   预热出来的缓存就是「半份」—— 主流程还得自己扛 1.5 小时。
      #   编完紧跟下面的 Save，于是这一趟就把 host 侧全齐了。
      # =========================================================
      - name: Build host go/rust from source
        id: host-src
        timeout-minutes: 200
        if: >-
          env.PREBUILT_HOST != 'true'
          && (env.IGNORE_CACHE == 'true'
              || (steps.cache-restore.outputs.cache-matched-key == ''
                  && steps.release-restore.outputs.restored != 'true'))
        run: |
          cd "$CACHE_ROOT"
          JOBS=$(nproc)
          for p in golang-bootstrap golang rust; do
            rel=$(find -L package -maxdepth 4 -type d -name "$p" 2>/dev/null | head -1)
            if [ -z "$rel" ]; then
              echo "::warning::树里没有 $p，跳过"
              continue
            fi
            echo "===== make $rel/host/compile ====="
            make "$rel/download" >/dev/null 2>&1 || true
            make "$rel/host/compile" -j"$JOBS" || make "$rel/host/compile" -j1 V=s || \
              echo "::warning::$p host 编译失败（其余继续）"
            case "$p" in rust) BIN=rustc ;; *) BIN=go ;; esac
            HITS=$(find staging_dir -path "*/bin/$BIN" \( -type f -o -type l \) 2>/dev/null)
            if [ -z "$HITS" ]; then
              echo "::warning::$p: make 返回 0，但 staging_dir 里没有 $BIN"
            else
              echo "✅ $p 产物已就位"
            fi
          done

          # ★ 预热完立刻冻结 build_dir 的 host 戳（source 模式专用，见 pwrt-cache.sh）。
          #   不冻结的话，这个缓存虽然含 go/rust 二进制，但下一轮 make 看不到
          #   built 戳，仍会把两个都自举一遍 —— 预热就白预热了。
          bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" freeze "$CACHE_ROOT" || true

      - name: Save build cache
        if: >-
          success()
          && steps.cache-restore.outputs.cache-hit != 'true'
          && (steps.toolchain.outcome == 'success' || steps.host-src.outcome == 'success')
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          key: ${{ steps.cache-key.outputs.key }}
          path: |
            ${{ env.CACHE_ROOT }}/.ccache
            ${{ env.CACHE_ROOT }}/staging_dir/host*
            ${{ env.CACHE_ROOT }}/staging_dir/tool*

      - name: Save cache to Release backup
        if: >-
          env.RELEASE_BACKUP == 'true'
          && success()
          && steps.cache-restore.outputs.cache-hit != 'true'
          && (steps.toolchain.outcome == 'success' || steps.host-src.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$CACHE_ROOT"
          KEY="${{ steps.cache-key.outputs.key }}"
          PREFIX="${{ steps.cache-key.outputs.prefix }}"
          TARBALL="${KEY}.tzst"

          which zstd >/dev/null 2>&1 || sudo -E apt-get -yqq install zstd >/dev/null 2>&1 || true

          if ! bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" pack "$CACHE_ROOT" "$CACHE_ROOT/$TARBALL"; then
            echo "::warning::打包失败，跳过 Release 备份"; exit 0
          fi

          SZ=$(stat -c%s "$TARBALL")
          if [ "$SZ" -gt 2000000000 ]; then
            echo "::warning::${SZ} 字节超过 2 GiB，跳过备份"; rm -f "$TARBALL"; exit 0
          fi

          gh release view "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Build Cache Backup" \
              --notes "整体构建缓存的长期备份，由 build-ponwrt / warm-cache 自动维护，请勿手动删除。" \
              --latest=false || true

          gh release upload "$CACHE_RELEASE" "$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber

          gh release view "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[] | "\(.createdAt) \(.name)"' 2>/dev/null \
            | grep " ${PREFIX}-" | awk '{print $2}' | grep -vx "$TARBALL" \
            | while read -r old; do
                echo "删除旧备份: $old"
                gh release delete-asset "$CACHE_RELEASE" "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
              done

          rm -f "$TARBALL"

      - name: Cache status
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-reports"
          REPORT_DIR="$GITHUB_WORKSPACE/build-reports" \
            bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" status "$CACHE_ROOT"

      - name: Upload cache report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          # ⚠ 名字里必须带 host_mode：矩阵现在有 soc × host_mode 两个维度，
          #   只带 soc 会让两个 job 传同名 artifact 而互相冲突。
          name: warm-cache-${{ matrix.soc }}-${{ matrix.host_mode }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/build-reports/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Warm Cache — ${{ matrix.soc }} / ${{ matrix.host_mode }}"
            echo ""
            echo "- key: \`${{ steps.cache-key.outputs.key }}\`"
            echo "- actions/cache 命中: ${{ steps.cache-restore.outputs.cache-matched-key || '无' }}"
            echo "- Release 备份恢复: ${{ steps.release-restore.outputs.restored || 'false' }}（key \`${{ steps.release-restore.outputs.restored_key }}\`）"
            echo "- 编译工具链: ${{ steps.toolchain.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # 与主流程同一个轮换动作，预热跑完也顺手清一次
  #
  #   ⚠ 单独成 job，不能并进 build：actions/cache/save 是收尾动作，
  #     紧跟着查有时还查不到新 key —— 会误判「没有当前代」而把唯一一份删了。
  cache-rollover:
    name: Roll build cache (${{ matrix.soc }} / ${{ matrix.host_mode }})
    needs: [prepare, build]
    # ⚠ 不用 needs.build.result == 'success'：矩阵现在是 soc × host_mode，
    #   只要 source 那条线超时，聚合结果就不是 success，prebuilt 那条已经
    #   存好的新代就永远轮换不掉。脚本内部本来就有保护 —— 没给 KEY 时保留
    #   「创建时间最新」的一代，当前代还没落库时直接跳过本轮，不会误删。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    concurrency:
      group: ponwrt-cache-rollover-${{ github.ref }}-${{ matrix.soc }}-${{ matrix.host_mode }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOC: ${{ matrix.soc }}
      # prefix 由 pwrt-cache.sh 现算，读的就是这个变量；
      # 漏了它就会去清另一条线的缓存（甚至算出 prebuilt 的前缀去删 source 的）
      HOST_MODE: ${{ matrix.host_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Roll cache generations
        continue-on-error: true
        run: |
          S="$GITHUB_WORKSPACE/scripts/pwrt-cache.sh"
          dos2unix "$S" 2>/dev/null || true
          # 只给前缀，不给 KEY：脚本会保留「创建时间最新」的那一代。
          # ⚠ 把原始输出抓到 PREFIX_OUT：算不出前缀时打出来，避免
          #   只看到一句 "算不出前缀，跳过" 却不知道 pwrt-cache.sh 报了什么。
          PREFIX_OUT=$(bash "$S" prefix 2>&1) || true
          PREFIX=$(printf '%s\n' "$PREFIX_OUT" | sed -n 's/^prefix=//p' | head -1)
          echo "PREFIX=$PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "::warning::算不出前缀，跳过。pwrt-cache.sh 原始输出："
            printf '%s\n' "$PREFIX_OUT"
            exit 0
          fi
          PREFIX="$PREFIX" KEY='' bash "$S" rollover
