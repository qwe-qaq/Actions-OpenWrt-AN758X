name: Test private repo pull

# 私有仓库（openwrt-fttr）拉取链路专项测试：
# 不跑编译，只验证「匿名探测 → Secret 取令牌 → insteadOf 注入 → 真实 clone → 包结构断言」
# 整条链路和 build-ponwrt.yml + diy-part1.sh 完全一致。
# 用法：Actions → Test private repo pull → Run workflow（令牌不用填，走 Secret）

on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: '要测试拉取的仓库（owner/repo；填 none = 只验证跳过逻辑）'
        required: false
        default: 'qwe-qaq/openwrt-fttr'
      private_repo_branch:
        description: '分支名'
        required: false
        default: 'main'

env:
  PRIVATE_REPO: ${{ github.event.inputs.private_repo || 'qwe-qaq/openwrt-fttr' }}
  PRIVATE_REPO_BRANCH: ${{ github.event.inputs.private_repo_branch || 'main' }}
  FTTR_LUCI_REPO: ${{ github.event.inputs.fttr_luci_repo || 'qwe-qaq/luci-app-fttr' }}
  FTTR_LUCI_BRANCH: ${{ github.event.inputs.fttr_luci_branch || 'main' }}

# 最小权限：只需要 checkout 本仓库
permissions:
  contents: read

jobs:
  test-pull:
    name: 私有仓库拉取测试
    runs-on: ubuntu-24.04
    # 同上：secrets 不能进 step 级 if，先在 job 级 env 里算成布尔标志
    env:
      HAS_APP_CREDS: ${{ secrets.PRIVATE_SOURCE_APP_ID != '' && secrets.PRIVATE_SOURCE_APP_PRIVATE_KEY != '' }}
      HAS_PAT: ${{ secrets.PRIVATE_REPO_TOKEN != '' || secrets.FTTR_TOKEN != '' }}
    steps:
      # 复现真实环境：checkout 会写入 http.https://github.com/.extraheader，
      # 必须验证凭证步骤能正确清掉它，否则它会盖掉 insteadOf 注入的 PAT
      - name: Checkout (复现真实环境的 extraheader)
        uses: actions/checkout@v5
        with:
          # 与 build-ponwrt.yml 保持一致：不持久化凭据。
          # checkout 默认会把 http.https://github.com/.extraheader 写进【本地】
          # .git/config，带的是仅本仓库权限的 GITHUB_TOKEN，会盖掉 PAT → 私有仓库 404
          persist-credentials: false

      # =========================================================
      # GitHub App 安装令牌（与 build-ponwrt.yml 同源同配置）
      # 1 小时有效、仅限白名单仓库、contents 只读、job 结束自动吊销；
      # 配不出来才回退到 Secret 里的 PAT。
      # =========================================================
      # 先探测后取凭证：两个仓库全公开就一个令牌都不申请
      - name: Probe FTTR repos visibility
        id: probe
        if: ${{ env.PRIVATE_REPO != 'none' }}
        run: |
          probe() {  # stdout: public|private；人读提示走 stderr
            local repo="$1" br="$2"
            if git ls-remote --exit-code --heads "https://github.com/${repo}" \
                 "refs/heads/${br}" >/dev/null 2>&1; then
              echo "  ✅ ${repo} (分支 ${br}) —— 公开，匿名可读" >&2
              echo "public"
            else
              echo "  🔒 ${repo} (分支 ${br}) —— 匿名不可读，需要凭证" >&2
              echo "private"
            fi
          }
          echo "=== FTTR 仓库可见性探测（匿名）==="
          R1=$(probe "${PRIVATE_REPO}" "${PRIVATE_REPO_BRANCH}")
          R2=$(probe "${FTTR_LUCI_REPO}" "${FTTR_LUCI_BRANCH}")
          NEED=false
          [ "$R1" = "private" ] || [ "$R2" = "private" ] && NEED=true
          echo "need_token=$NEED" >> "$GITHUB_OUTPUT"
          echo "backend=$R1" >> "$GITHUB_OUTPUT"
          echo "luci=$R2" >> "$GITHUB_OUTPUT"

          # 只把私有仓库放进令牌白名单：混进公开但未安装的仓库会 422
          TOKEN_REPOS=""
          add_repo() {
            [ "$1" = "private" ] || return 0
            local name="${2#*/}"
            if [ -z "$TOKEN_REPOS" ]; then TOKEN_REPOS="$name"; else TOKEN_REPOS="$TOKEN_REPOS,$name"; fi
          }
          add_repo "$R1" "${PRIVATE_REPO}"
          add_repo "$R2" "${FTTR_LUCI_REPO}"
          echo "token_repos=$TOKEN_REPOS" >> "$GITHUB_OUTPUT"
          echo "  令牌白名单（仅私有仓库）：${TOKEN_REPOS:-（空）}"
          echo "结论：$( [ "$NEED" = true ] && echo '至少一个需要凭证 → 申请 App 令牌' || echo '全部公开 → 跳过取凭证' )"

      - name: Debug creds presence
        run: |
              echo "APP_ID       非空: ${{ secrets.PRIVATE_SOURCE_APP_ID != '' }}"
              echo "APP_CLIENT_ID 非空: ${{ vars.PRIVATE_SOURCE_APP_CLIENT_ID != '' }}"
              echo "PRIVATE_KEY  非空: ${{ secrets.PRIVATE_SOURCE_APP_PRIVATE_KEY != '' }}"
              echo "HAS_APP_CREDS  : ${HAS_APP_CREDS}"
      - name: Create private source token
        id: private-source-token
        # 没配 App 凭证就跳过（否则 action 抛 Input required and not supplied: app-id）
        if: ${{ steps.probe.outputs.need_token == 'true' && env.HAS_APP_CREDS == 'true' }}
        # 拿不到令牌不炸 job：交给 Setup 步骤回退 PAT
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PRIVATE_SOURCE_APP_ID }}
          client-id: ${{ secrets.PRIVATE_SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          repositories: ${{ steps.probe.outputs.token_repos }}

      - name: Prepare private Git authentication
        if: ${{ steps.probe.outputs.need_token == 'true' && (env.HAS_APP_CREDS == 'true' || env.HAS_PAT == 'true') }}
        run: |
          install -m 700 "$GITHUB_WORKSPACE/scripts/git_askpass.sh" "$RUNNER_TEMP/git-askpass"
          echo "GIT_ASKPASS=$RUNNER_TEMP/git-askpass" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      # =========================================================
      # 预检：把「令牌有没有效」和「配置有没有被污染」分开定位，
      # 失败时不用猜。纯信息展示，不拦截流程
      # =========================================================
      - name: Pre-flight diagnostics
        env:
          APP_TOKEN: ${{ steps.private-source-token.outputs.token }}
          SEC_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SEC_TOKEN_LEGACY: ${{ secrets.FTTR_TOKEN }}
        run: |
          TOKEN="${APP_TOKEN:-${SEC_TOKEN:-${SEC_TOKEN_LEGACY}}}"
          echo "  App 凭证已配置: ${HAS_APP_CREDS}    PAT 已配置: ${HAS_PAT}"

          echo "=== 1. extraheader 残留检查（只报存在性，不打印内容）==="
          for scope in global local; do
            if git config --$scope --get http.https://github.com/.extraheader >/dev/null 2>&1; then
              echo "  ⚠ $scope 配置里有 extraheader（凭证步骤会清掉它）"
            else
              echo "  ✅ $scope 配置无 extraheader"
            fi
          done

          if [ -z "$TOKEN" ]; then
            echo
            echo "=== 2. 没有可用令牌（GitHub App / PRIVATE_REPO_TOKEN / FTTR_TOKEN 均为空）==="
            exit 0
          fi

          echo
          echo "=== 2. 令牌身份与仓库访问权限（GitHub API，不打印令牌）==="
          LOGIN=$(curl -s -H "Authorization: Bearer $TOKEN" https://api.github.com/user \
                    | grep -m1 '"login"' | sed -E 's/.*"login": *"([^"]+)".*/\1/')
          # App 安装令牌没有「用户身份」，/user 取不到是正常现象，不是失效
          echo "  令牌归属: ${LOGIN:-（无 /user 身份 —— App 安装令牌的正常表现）}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                   -H "Authorization: Bearer $TOKEN" \
                   "https://api.github.com/repos/${PRIVATE_REPO}")
          case "$CODE" in
            200) echo "  API 访问 ${PRIVATE_REPO}: ✅ 200（令牌看得见该仓库）" ;;
            404) echo "  API 访问 ${PRIVATE_REPO}: ❌ 404（令牌无权限，或 Repository access 没选中该仓库）" ;;
            401) echo "  API 访问 ${PRIVATE_REPO}: ❌ 401（令牌无效/已吊销）" ;;
            *)   echo "  API 访问 ${PRIVATE_REPO}: ❌ HTTP $CODE" ;;
          esac

      # =========================================================
      # 凭证步骤：与 build-ponwrt.yml 的 Setup private repo
      # credentials 保持逐行一致 —— 改一边记得同步另一边
      # =========================================================
      - name: Setup private repo credentials
        env:
          APP_TOKEN: ${{ steps.private-source-token.outputs.token }}
          SEC_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SEC_TOKEN_LEGACY: ${{ secrets.FTTR_TOKEN }}
        run: |
          if [ "${PRIVATE_REPO}" = "none" ]; then
            echo "⚠ PRIVATE_REPO=none —— 跳过拉取测试"
            exit 0
          fi

          # 探测已认定两个仓库都能匿名读 → 一个凭证都不注入
          if [ "${{ steps.probe.outputs.need_token }}" != "true" ]; then
            echo "✅ 探测结论：${PRIVATE_REPO} / ${FTTR_LUCI_REPO} 均可匿名访问（公开仓库），不注入任何凭证"
            exit 0
          fi

          BASE_URL="https://github.com/${PRIVATE_REPO}"
          # 日志脱敏：URL 里的 user:token@ 一律替换成 ***@
          sanitize() { sed -E 's#://[^@/]+@#://***@#g'; }

          # 1) 先试匿名：公开仓库不需要任何凭证
          if ERR=$(env -u GIT_ASKPASS git ls-remote --exit-code --heads "$BASE_URL" \
                     "refs/heads/${PRIVATE_REPO_BRANCH}" 2>&1); then
            echo "✅ ${BASE_URL} 可匿名访问（公开仓库），无需凭证"
            exit 0
          fi

          # 2) 匿名被拒才要令牌：App 安装令牌 > Secret 里的 PAT
          if [ -n "${APP_TOKEN}" ]; then
            TOKEN="${APP_TOKEN}"; SRC="GitHub App 安装令牌"
          elif [ -n "${SEC_TOKEN}" ]; then
            TOKEN="${SEC_TOKEN}"; SRC="Secret PRIVATE_REPO_TOKEN"
          elif [ -n "${SEC_TOKEN_LEGACY}" ]; then
            TOKEN="${SEC_TOKEN_LEGACY}"; SRC="Secret FTTR_TOKEN（旧名）"
          else
            TOKEN=""
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::仓库 ${PRIVATE_REPO} 匿名访问被拒且没有可用凭证。"
            echo "        推荐：Secrets 配 PRIVATE_SOURCE_APP_ID + PRIVATE_SOURCE_APP_PRIVATE_KEY（GitHub App 装到 ${PRIVATE_REPO}，Contents: Read-only）"
            echo "        回退：Secrets 配 PRIVATE_REPO_TOKEN（PAT，需对该仓库有 Contents 读权限）"
            echo "--- git 原始错误 ---"
            printf '%s\n' "$ERR" | sanitize
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "ℹ 凭证来源：$SRC"

          # checkout 注入的 github.com 通用 Authorization 头会盖掉我们的 PAT，先清掉
          # ⚠ checkout 写的是【本地】.git/config（见 actions/checkout 源码
          #   git-auth-helper.ts configureToken 默认 configPath=.git/config），
          #   本地配置优先级高于全局，只 unset --global 根本清不掉！
          #   2026-10-20 实测：只清全局时带令牌仍 404 Repository not found。
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # 令牌写给 askpass 读：不进 git config、不进后续步骤的 env。
          # 公开仓库 clone 不会触发 askpass，只有真正要认证的远端才会回调。
          TOKEN_FILE="$RUNNER_TEMP/gh_token"
          printf '%s' "$TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"

          # ⚠ 写 $GITHUB_ENV 只对【后续步骤】生效，本步骤当前进程看不见。
          #   下面紧跟的复检就跑在本步骤里，必须同时 export，否则 askpass
          #   读到空的 GH_TOKEN_FILE → "unable to read askpass response"。
          export GH_TOKEN_FILE="$TOKEN_FILE"
          export GIT_ASKPASS="${GIT_ASKPASS:-$RUNNER_TEMP/git-askpass}"
          echo "GH_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"

          # 自检：直接问一次 askpass，拿不到令牌就别往下跑（省得git 报黑盒错误）
          if ! ASK=$(GIT_ASKPASS="$GIT_ASKPASS" "$GIT_ASKPASS" "Password for 'https://github.com':" 2>/dev/null) \
               || [ -z "$ASK" ]; then
            echo "::error::askpass 自检失败：拿不到令牌（令牌文件为空？askpass 脚本没可执行位？）"
            exit 1
          fi
          echo "  askpass 自检通过（令牌长度 ${#ASK}，值不打印）"

          # 3) 带凭证复检：失败时打印脱敏后的真实错误，别只给一句黑盒提示
          if ERR=$(git ls-remote --exit-code --heads "$BASE_URL" \
                     "refs/heads/${PRIVATE_REPO_BRANCH}" 2>&1); then
            echo "✅ 凭证已注入并验证通过：${BASE_URL} (分支 ${PRIVATE_REPO_BRANCH})"
          else
            echo "::error::仓库 ${PRIVATE_REPO} 的分支 ${PRIVATE_REPO_BRANCH} 带凭证访问失败"
            echo "--- git 原始错误（已脱敏）---"
            printf '%s\n' "$ERR" | sanitize
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                     "https://api.github.com/repos/${PRIVATE_REPO}")
            echo "--- API /repos/${PRIVATE_REPO} → HTTP $CODE ---"
            case "$CODE" in
              200) echo "ℹ API 可见但 git 取不到：多半是分支 ${PRIVATE_REPO_BRANCH} 不存在" ;;
              404) echo "ℹ 404：App 没安装到 ${PRIVATE_REPO}（或 repositories 白名单漏了）；走 PAT 则是 Repository access 没选中该仓库 / 只勾了默认的 Metadata（读不了 git）" ;;
              401) echo "ℹ 401：令牌无效或已过期（App 安装令牌只有 1 小时，不跨 job 复用）" ;;
            esac

            exit 1
          fi

      # =========================================================
      # 真实 clone：命令与 diy-part1.sh 的 clone() 完全一致
      # （git clone --depth 1 -b <branch> <裸URL>），URL 里不拼 token，
      # 靠上一步的 insteadOf 生效 —— 这一步过不了，编译时也一定挂
      # =========================================================
      - name: Clone test (与 diy-part1.sh 相同的命令)
        run: |
          set -euo pipefail
          if [ "${PRIVATE_REPO}" = "none" ]; then
            echo "⚠ PRIVATE_REPO=none —— 跳过 clone 测试"
            exit 0
          fi

          DEST="$RUNNER_TEMP/openwrt-fttr"
          rm -rf "$DEST"

          echo "=== git clone --depth 1 -b ${PRIVATE_REPO_BRANCH} https://github.com/${PRIVATE_REPO} ==="
          git clone --depth 1 -b "${PRIVATE_REPO_BRANCH}" \
            "https://github.com/${PRIVATE_REPO}" "$DEST"

          echo
          echo "✅ clone 成功，最近提交："
          git -C "$DEST" log -1 --format='  %H  %ad  %an  %s' --date=iso
          echo
          echo "=== 顶层内容（feed 形态：根目录直接是包目录，没有 package/ 子目录）==="
          ls -A "$DEST"

          echo
          echo "=== diy-part1.sh 同款断言：包目录 + Makefile 存在 ==="
          FAIL=0
          # 上游 2026-11 把 h3c-fttr-tools 改名为 openwrt-fttr，源目录在
          # 不同快照里可能是 fttr / fttr-tools / h3c-fttr-tools，逐个探测，
          # 与 diy-part1.sh 用同一套候选名。
          FTTR_TOOLS_DIR=""
          for cand in fttr fttr-tools h3c-fttr-tools openwrt-fttr; do
            if [ -f "$DEST/$cand/Makefile" ]; then
              FTTR_TOOLS_DIR="$cand"
              break
            fi
          done
          if [ -z "$FTTR_TOOLS_DIR" ]; then
            echo "  ❌ 未找到 openwrt-fttr 源目录（试过 fttr / fttr-tools / h3c-fttr-tools / openwrt-fttr）"
            FAIL=1
          fi
          for p in h3c-fmcs h3c-fmcs-firmware ${FTTR_TOOLS_DIR:+$FTTR_TOOLS_DIR}; do
            if [ -f "$DEST/$p/Makefile" ]; then
              # ⚠ grep 无匹配会退出 1，pipefail+set -e 会因此杀掉整个步骤，
              #   必须 || true 兜底（h3c-fmcs 是 KernelPackage，本来就没有
              #   PKG_VERSION 行，只有 PKG_RELEASE，属于正常现象）
              V=$(grep -m1 '^PKG_VERSION' "$DEST/$p/Makefile" 2>/dev/null \
                    | sed 's/PKG_VERSION:=//' | tr -d ' \r' || true)
              if [ -n "$V" ]; then
                echo "  ✅ $p  (PKG_VERSION=$V)"
              else
                echo "  ✅ $p  (无 PKG_VERSION 行 —— KernelPackage 正常，只有 PKG_RELEASE)"
              fi
            else
              echo "  ❌ 缺少 $DEST/$p/Makefile（上游改结构了？）"
              FAIL=1
            fi
          done

          # h3c-fmcs-firmware 里应是 2MB 左右的实文件（不是 Git LFS 指针）
          SBIT=$(find "$DEST/h3c-fmcs-firmware" -name '*.sbit' 2>/dev/null | head -1)
          if [ -n "$SBIT" ]; then
            SZ=$(du -h "$SBIT" | cut -f1)
            echo "  ℹ FPGA 比特流: ${SBIT#$DEST/} ($SZ)"
            if head -c 200 "$SBIT" | grep -q 'git-lfs'; then
              echo "  ⚠ 看起来是 Git LFS 指针而不是实文件，runner 上需要先装 git-lfs"
            fi
          else
            echo "  ⚠ 未找到 .sbit 文件（结构可能变了，留意一下）"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::包结构断言失败 —— clone 能过但内容不对，编译时包会被 defconfig 剔除"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "✅ 私有仓库拉取测试全部通过"
          echo "=========================================="
