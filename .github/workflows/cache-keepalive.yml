name: Keep Build Caches Alive

# =========================================================
# actions/cache 的条目 7 天没人访问就回收。
#   缓存是目录形态、key = 前缀 + 提交号，所以按前缀把最新一代真恢复一次
#   就算访问过（顺带验证了它在不在、能不能解开）。
# ⚠ 不做 lookup-only：实测既不能可靠命中，也不一定刷新 lastAccessedAt。
# ⚠ 也不用前缀回退去猜：先列出实际存在的 key，再逐个按精确 key 恢复 ——
#   能命中就一定看得见，命中不了也看得见。
# =========================================================

on:
  schedule:
    # 每 3 天一次：主流程与 warm-cache 都不一定每周跑，
    # 卡在 7 天线边缘容易被回收
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只列出缓存，不做恢复'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  actions: write

jobs:
  # ---------------------------------------------------------
  # 枚举：每个前缀只留「创建时间最新」的那一代
  # ---------------------------------------------------------
  enum:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.list.outputs.keys }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: List cache keys
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh cache list -R "$GITHUB_REPOSITORY" --limit 200 \
            --json key,createdAt,sizeInBytes > all.json

          echo "===== 全部 ponwrt-* 缓存 ====="
          jq -r '.[] | select(.key | startswith("ponwrt-"))
                 | "\(.createdAt)\t\(.sizeInBytes/1048576|floor)MB\t\(.key)"' all.json \
            | sort -r

          # 「同族」判定与 scripts/cache-roll.jq 一致：
          #   先剥 -early（工具链刚编完时存的早期版），再剥末尾 40 位提交号，
          #   最后剥 dl 的 6 位周号。每族只取一条去恢复 —— 把每条历史 dl
          #   （2~5 GB）都下下来纯属浪费，它们互为超集。
          #   同族里优先取「不带 -early 的正式 key」：它才是完整版
          #   （含 golang / rust hostpkg），-early 只有 tools/toolchain。
          KEYS=$(jq -r '
            [ .[] | select(.key | startswith("ponwrt-")) ]
            | group_by(.key
                | sub("-early$"; "")
                | sub("-[0-9a-f]{40}$"; "")
                | sub("-[0-9]{6}$"; ""))
            | map(
                (sort_by(.createdAt) | reverse) as $g
                | (($g | map(select(.key | endswith("-early") | not)) | first)
                   // $g[0]) | .key
              )
            | .[]' all.json)

          COUNT=$(printf '%s\n' "$KEYS" | grep -c . || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::没有 ponwrt-* 缓存（还没建过，或已被全部清理）"
            # ⚠ 矩阵不能是空数组（GitHub 会报 "Matrix must define at least one vector"），
            #   给一个占位值，真正干活的那个 job 由 count 判断跳过
            echo 'keys=["__none__"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "keys=$(printf '%s\n' "$KEYS" | jq -R -s 'split("\n") | map(select(length>0))' | tr -d '\n')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------
  # 保活：逐个真实恢复
  #
  #   ⚠ path 必须与写入时一致，且目录要在本 job 里先建好。
  #     指向不存在的目录时，actions/cache 的行为未定义（很可能直接 miss）。
  # ---------------------------------------------------------
  touch:
    needs: enum
    if: needs.enum.outputs.count != '0' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        key: ${{ fromJson(needs.enum.outputs.keys) }}
      fail-fast: false
      max-parallel: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare paths
        run: |
          echo "目标 key: ${{ matrix.key }}"
          # ⚠ 必须 sudo：/workdir 建在根目录下，runner 用户没有 / 的写权限
          #   （不加就是 "mkdir: cannot create directory '/workdir': Permission denied"，
          #    整个保活 job 直接红）。缓存写入时的绝对路径是 /workdir/openwrt/...，
          #   restore 只会往这个路径解压，所以目录必须【在这里】就建好并交给 $USER。
          #
          # ⚠ 三个 staging_dir 子目录必须单独建出来：actions/cache/restore 对
          #   "path 指向不存在的目录"行为未定义（实测可能直接 miss）。
          #   glob `host*` 覆盖 host 与 hostpkg，`tool*` 覆盖 toolchain 与
          #   toolchain-*。用 brace expansion 一行解决。
          sudo mkdir -p /workdir/openwrt/{.ccache,staging_dir/{host,hostpkg,toolchain}}
          sudo chown -R "$USER":"$USER" /workdir

      - name: Restore ${{ matrix.key }}
        id: t
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/staging_dir/host*
            /workdir/openwrt/staging_dir/tool*
          key: ${{ matrix.key }}

      # 第一次 restore 网络抖动时补一次：这次保活白做的话，下次定时任务
      # 可能在 7 天窗口外才轮到，缓存就被回收了。重试成本低、收益明显。
      - name: Restore retry (network flake)
        if: steps.t.outputs.cache-hit != 'true'
        id: t2
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/staging_dir/host*
            /workdir/openwrt/staging_dir/tool*
          key: ${{ matrix.key }}

      - name: Result
        if: always()
        run: |
          # 优先看第一次，失败再看重试
          HIT='${{ steps.t.outputs.cache-hit }}'
          [ "$HIT" = "true" ] || HIT='${{ steps.t2.outputs.cache-hit }}'
          if [ "$HIT" = "true" ]; then
            echo "✅ 命中并已刷新访问时间"
          else
            echo "::warning::未命中。按概率排查："
            echo "::warning::1) 该条目建在别的分支 —— actions/cache 只能读当前/上游/默认分支"
            echo "::warning::2) key 与 Caches 页面不完全一致"
            echo "::warning::3) 已被 7 天规则回收（gh 列表有延迟）"
          fi
          du -sh /workdir/openwrt 2>/dev/null || true

  # ---------------------------------------------------------
  # 收尾：把当前状态打一份，方便对照
  # ---------------------------------------------------------
  verify:
    needs: [enum, touch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Show all caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== 缓存总览（按创建时间倒序）====="
          gh cache list -R "$GITHUB_REPOSITORY" --limit 200 \
            --json key,sizeInBytes,createdAt,lastAccessedAt \
            --jq 'sort_by(.createdAt) | reverse | .[]
                  | "创建 \(.createdAt[0:16])  访问 \(.lastAccessedAt[0:16])  \(.sizeInBytes/1048576|floor)MB  \(.key)"'
          echo ""
          echo "总占用："
          gh cache list -R "$GITHUB_REPOSITORY" --limit 200 --json sizeInBytes \
            --jq '([.[].sizeInBytes] | add // 0) / 1048576 | floor | "\(.) MB（配额 10240 MB）"'
