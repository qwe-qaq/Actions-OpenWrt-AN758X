name: Build PonWrt (Airoha AN758x PON)

# =========================================================
# 固件版本后缀（显示在 LuCI 概览页「固件版本」后面）
#   FW_AUTHOR 是唯一真相源，改动请只改 env.FW_AUTHOR 这一处。
# =========================================================
env:
  BUILD_ROOT: /workdir
  SOURCE: ${{ github.event.inputs.source || 'fork' }}
  # 唯一真相源：固件版本后缀的作者名（LuCI 概览页「固件版本」）
  # 由 fw_author 输入项覆盖，留空则 qwe
  FW_AUTHOR: ${{ github.event.inputs.fw_author || 'qwe' }}
  REPO_URL: ${{ github.event.inputs.source == 'pbs05/ponwrt' && 'https://github.com/pbs05/ponwrt' || 'https://github.com/qwe-qaq/ponwrt' }}
  FEEDS_CONF: ''
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: ${{ github.event.inputs.upload_release || 'true' }}
  USE_DL_CACHE: true
  USE_CCACHE: false
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  SOC: ${{ github.event.inputs.soc || 'an7581' }}
  PROFILE: ${{ github.event.inputs.profile || 'fiberhome_an4475-g2' }}
  BUILD_SCOPE: ${{ github.event.inputs.scope || 'firmware' }}
  IGNORE_CACHE: ${{ github.event.inputs.ignore_cache || 'false' }}
  FW_BUILD_TIME: ''                 # 留空 = 自动取构建时时间（Asia/Shanghai）
  FW_DESC_SUFFIX: ''               # 留空 = "· qwe · <构建时间>"；填了则完全自定义

  # =========================================================
  # 加密加速开关（★ 本次新增，写在这里才是 workflow 级 env）
  #
  # ⚠ 用 github.event.inputs 而不是 inputs：本文件可被 repository_dispatch
  #   触发，那种触发下 inputs 上下文不可靠，而文件里其余 env 项（SOURCE /
  #   REPO_URL / BUILD_SCOPE…）统一都用 github.event.inputs，保持一致。
  #
  # ⚠ 默认值不能用 "|| " 兜：GitHub 表达式里字符串 '0' 会被转成数字 0 判为假，
  #   `${{ github.event.inputs.x || '1' }}` 在用户显式选 0 时会错误地返回 '1'。
  #
  # ⚠ 也不能用 "!= '0'" 兜：本文件有 repository_dispatch 触发器，那种触发下
  #   github.event.inputs.* 为 null，null 在字符串比较里被当成空串 ''，
  #   '' != '0' 成立 → 返回 '1'。也就是说声明的 default: '0' 完全失效，
  #   repository_dispatch / API 重跑时开关会被静默打开。
  #   三个开关统一用 "== '1'"：只有显式传 '1' 才开，其余（0 / 空 / null）全关。
  # =========================================================
  OPT_CRYPTO_ARM64CE: ${{ github.event.inputs.opt_arm64ce == '1' && '1' || '0' }}
  OPT_CRYPTO_CHACHA:  ${{ github.event.inputs.opt_chacha  == '1' && '1' || '0' }}
  OPT_CRYPTO_EIP93:   ${{ github.event.inputs.opt_eip93   == '1' && '1' || '0' }}

  # ---- FTTR 相关仓库 ----
  # 填 none = 本次不拉这些仓库，FTTR 相关包整体跳过
  # 两个仓库的可见性不保证一致（当前：luci 公开、后端私有），所以运行时
  # 逐个匿名探测，只有探测失败的才注入凭证。
  PRIVATE_REPO: ${{ github.event.inputs.private_repo || 'qwe-qaq/openwrt-fttr' }}
  PRIVATE_REPO_BRANCH: ${{ github.event.inputs.private_repo_branch || 'main' }}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source:
        description: '编译源码仓库'
        required: true
        default: 'pbs05/ponwrt'
        type: choice
        options:
          - fork
          - pbs05/ponwrt
      branch:
        description: 'ponwrt 源码分支'
        required: true
        default: 'master'
      soc:
        description: 'SoC 平台'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583
      profile:
        description: '机型 profile (all=全机型编译)'
        required: true
        default: 'fiberhome_an4475-g2'
        type: choice
        options:
          - fiberhome_an4475-g2
          - fiberhome_hg5585f-cu
          - fiberhome_hg5585f-ct
          - fiberhome_hg5382a
          - gemtek_xg2010g
          - nokia_xg-040g-md-ubi
          - nokia_xg-040g-tf-ubi
          - unionman_ung00a
          - znxt_zn504xg-d
          - znxt_zn515xg-d
          - h3c_hm2004-du
          - nokia_xg-040g-mf
          - nokia_xg-040g-mf-ubi
          - all

      # ---------- 加密加速开关 ----------
      # 用 choice 而不是 boolean：本文件其余开关（scope / ignore_cache /
      # upload_release / ssh）一律是 choice + 字符串，保持一致；且 boolean
      # 输入在 API 重跑 / repository_dispatch 时拿不到值，会退化成空串。
      opt_arm64ce:
        description: 'arm64 汇编加密实现（AN7581 走 NEON 位切片 / AN7583 走 CE，按 SoC 自动选）'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

      opt_chacha:
        description: 'ChaCha20-Poly1305 NEON（Xray / sing-box / WireGuard 推荐）。注：机型 configs 里 chacha20 三个包本就默认 =y，此开关主要额外带 gcm/ccm/ctr/xts'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

      opt_eip93:
        description: 'EIP93 硬件加密引擎（仅大块 IPSec / 大文件 TLS 有收益，小包更慢）'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

      scope:
        description: '构建范围 (toolchain-only 仅预热工具链缓存)'
        required: true
        default: 'firmware'
        type: choice
        options:
          - firmware
          - toolchain-only
      ignore_cache:
        description: '忽略工具链缓存强制重编'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      # 覆盖口：不填即为 env.FW_AUTHOR 的 "qwe"。保留输入项仅为临时指定其他作者。
      fw_author:
        description: '覆盖固件版本后缀的作者名（LuCI 概览页「固件版本」）。留空 = qwe'
        required: false
        default: 'qwe'
      upload_release:
        description: '固件发布到 Release（false 则只传 Artifact）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      private_repo:
        description: '拉取私有仓库（FTTR 三件套来源，需凭证）'
        required: false
        default: 'qwe-qaq/openwrt-fttr'
        type: choice
        options:
          - qwe-qaq/openwrt-fttr
          - none
      private_repo_branch:
        description: '私有仓库分支'
        required: false
        default: 'main'
      ssh:
        description: 'SSH connection to Actions (仅 main 分支、仓库所有者可触发)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 最小权限：发布阶段需要 contents: write；清理阶段需要 actions: read/write
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # 350 分钟接近 GitHub-hosted 6 小时上限；首次冷构建（工具链+全量 kmod）
    # 在 4 核 16G runner 上可能超时，建议拆出 toolchain-only 预热 job。
    timeout-minutes: 350

    # ⚠ secrets 上下文不允许出现在 step 级 if 里（GitHub 的上下文可用性表
    #   没给 steps.if 这一项，写了会直接报 Unrecognized named-value: 'secrets'）。
    #   所以在 job 级 env 里把「凭证配了没」算成布尔串，step 里只判断这个标志。
    #   标志本身是 true/false，不含任何秘密值。
    env:
      HAS_APP_CREDS: ${{ secrets.PRIVATE_SOURCE_APP_ID != '' && secrets.PRIVATE_SOURCE_APP_PRIVATE_KEY != '' }}
      HAS_PAT: ${{ secrets.PRIVATE_REPO_TOKEN != '' || secrets.FTTR_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 不持久化凭据：checkout 会把 http.https://github.com/.extraheader
          # 写进【本地】.git/config，那个头带的是仅本仓库权限的 GITHUB_TOKEN，
          # 会盖掉凭证步骤注入的 PAT，导致私有仓库 404（本流程无 git push，
          # 后续只用 gh CLI + env 里的 GITHUB_TOKEN，不需要 git 持久化凭据）
          persist-credentials: false

      # =========================================================
      # 0. 解析机型 -> 自动校正 SoC，导出 device name
      # =========================================================
      - name: Resolve device profile
        id: resolve
        run: |
          PROFILE="${PROFILE}"
          SOC="${SOC}"

          # 缓存版本号：按「年+周」滚动（如 202639）。
          # 用途：dl / ccache 的 key 用它替代 run_id、run_number。
          # 若用 run_* ，每次运行都会 save 一份新副本，10GB 配额很快被
          # 刷满并淘汰掉真正有用的旧缓存；改用周号后同一周内复用同一条目。
          echo "week=$(date +%Y%W)" >> "$GITHUB_OUTPUT"

          if [ "$PROFILE" != "all" ]; then
            case "$PROFILE" in
              nokia_xg-040g-mf*) SOC="an7583" ;;
              *)                  SOC="an7581" ;;
            esac
          fi

          # 若传入的 soc 与机型冲突，以机型为准
          echo "SOC=$SOC" >> "$GITHUB_ENV"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "DEVICE_NAME=ponwrt-${SOC}-${PROFILE}" >> "$GITHUB_ENV"
          # 每机型一份 config；profile=all 时回退到 SoC 通用配置
          if [ "$PROFILE" = "all" ]; then
            echo "CONFIG_FILE=configs/${SOC}.config" >> "$GITHUB_ENV"
          else
            echo "CONFIG_FILE=configs/${PROFILE}.config" >> "$GITHUB_ENV"
          fi

          echo "========================================"
          echo "SoC      : $SOC"
          echo "Profile  : $PROFILE"
          echo "Source   : ${SOURCE} (${REPO_URL})"
          echo "Branch   : ${REPO_BRANCH}"
          echo "Scope    : ${BUILD_SCOPE}"
          echo "Author   : ${FW_AUTHOR}"
          echo "Crypto   : ARM64CE=${OPT_CRYPTO_ARM64CE} CHACHA=${OPT_CRYPTO_CHACHA} EIP93=${OPT_CRYPTO_EIP93}"
          echo "========================================"

      # =========================================================
      # 1. 释放空间 + 初始化编译环境
      # =========================================================
      - name: Free disk space & init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # --- 删除预装大件 ---
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo -E apt-get -yqq purge firefox snapd 2>/dev/null || true

          # --- 配置 8G Swap (aarch64 工具链/内核编译需要) ---
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

          # --- 安装编译依赖 ---
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install build-essential clang llvm dwarves \
            libssl-dev libelf-dev bc flex bison python3 python3-distutils \
            xz-utils tar unzip zip zstd dos2unix ccache gettext \
            rsync file wget curl git subversion 2>/dev/null || true

          # 初始化编译环境：建议将该脚本入仓并按 commit sha 校验，
          # 避免 `curl | bash` 的供应链风险。
          if [ -x "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" ]; then
            bash "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" || true
          else
            sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)' || true
          fi

          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq clean
          sudo -E timedatectl set-timezone "$TZ"

          # --- 编译根目录（固定 /workdir，与 workflow 级 env 保持一致）---
          # 注意：BUILD_ROOT 必须是 workflow 级静态变量，不能用 GITHUB_ENV 动态写入，
          # 否则 actions/cache 的 with.path 里 ${{ env.BUILD_ROOT }} 会解析成空串，
          # dl 缓存命中不到 /openwrt/dl，导致工具链编译时源码包缺失。
          sudo mkdir -p /workdir
          sudo chown "$USER":"$USER" /workdir

          echo "磁盘空间:"; df -hT
          echo "内存/Swap:"; free -h

      # =========================================================
      # 2. 克隆源码
      # =========================================================
      - name: Clone source code
        run: |
          cd "$BUILD_ROOT"
          df -hT "$PWD"
          git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
          ln -sf "$BUILD_ROOT/openwrt" "$GITHUB_WORKSPACE/openwrt"

          # 输入项为空时回退到 workflow 级默认值，确保 diy-part2.sh 拿到的
          # 始终是确定值，而不是空串（空串会让 LuCI 概览页显示 "·  ·"）。
          echo "FW_AUTHOR=${FW_AUTHOR:-qwe}" >> "$GITHUB_ENV"

          # 加密开关同样固化一遍：写进 GITHUB_ENV 后，即便哪天 workflow 级
          # env 表达式改了，本 job 后续步骤读到的仍是本次解析出的确定值。
          echo "OPT_CRYPTO_ARM64CE=${OPT_CRYPTO_ARM64CE}" >> "$GITHUB_ENV"
          echo "OPT_CRYPTO_CHACHA=${OPT_CRYPTO_CHACHA}" >> "$GITHUB_ENV"
          echo "OPT_CRYPTO_EIP93=${OPT_CRYPTO_EIP93}" >> "$GITHUB_ENV"

          cd openwrt && echo "commit: $(git rev-parse --short HEAD)"

      # =========================================================
      # 2.5 私有仓库凭证（openwrt-fttr feed 的来源）
      #
      # 凭证优先级：GitHub App 安装令牌 > Secret 里的 PAT
      #   App 令牌：1 小时有效、仅限白名单仓库、contents 只读、job 结束自动吊销，
      #             泄露窗口和权限面都比长期 PAT 小一个量级。
      #
      # 注入方式：GIT_ASKPASS（而不是 git insteadOf）
      #   令牌写进 $RUNNER_TEMP/gh_token（600），git 被要求认证时才由 askpass
      #   读出来。好处：令牌不进命令行、不写进 ~/.gitconfig、不出现在后续
      #   步骤的 env 里；diy-part1.sh 的 clone URL 保持裸 URL，一行都不用改。
      #   ⚠ 别再拼 user:token@ 或写 url.*.insteadOf —— 那会落盘到 git config，
      #     还会和 checkout 注入的 extraheader 抢优先级（后者写本地 .git/config，
      #     本地优先级更高，会直接盖掉令牌 → 404 Repository not found）。
      #
      # PAT 回退：secrets.PRIVATE_REPO_TOKEN > secrets.FTTR_TOKEN（旧名兼容）
      # ⚠ workflow_dispatch 的输入值会明文出现在 run 页面、也能被 API 读到，
      #   所以不设令牌输入框，长期凭证只放 Secret。
      # =========================================================

      # ---------------------------------------------------------
      # 先探测、后取凭证：公开仓库零凭证直接 clone，只有私有仓库才去申请
      # GitHub App 令牌。好处有三：
      #   1) 仓库哪天转公开，不用改任何配置自动生效；
      #   2) 没装 App 的 fork 在「后端仓库是公开」的情况下照样能跑；
      #   3) 令牌只在真正需要时才存在，暴露面最小。
      # 探测必须真匿名：此时 GIT_ASKPASS 尚未设置，且 checkout 已用
      # persist-credentials: false，git 里没有本仓库的 GITHUB_TOKEN 头。
      # ---------------------------------------------------------
      - name: Probe FTTR repos visibility
        id: probe
        if: ${{ env.PRIVATE_REPO != 'none' && (env.PROFILE == 'h3c_hm2004-du' || github.event.inputs.profile == 'h3c_hm2004-du') }}
        run: |
          NEED=false
          # 状态词走 stdout 给调用方捕获，人读的提示走 stderr（否则会被 $( ) 吃掉）
          probe() {  # probe <owner/repo> <branch> → stdout: public|private
            local repo="$1" br="$2"
            if git ls-remote --exit-code --heads "https://github.com/${repo}" \
                 "refs/heads/${br}" >/dev/null 2>&1; then
              echo "  ✅ ${repo} (分支 ${br}) —— 公开，匿名可读，不需要凭证" >&2
              echo "public"
            else
              echo "  🔒 ${repo} (分支 ${br}) —— 匿名不可读，需要凭证" >&2
              echo "private"
            fi
          }

          echo "=== FTTR 仓库可见性探测（匿名）==="
          R1=$(probe "${PRIVATE_REPO}" "${PRIVATE_REPO_BRANCH}")
          R2=$(probe "${FTTR_LUCI_REPO}" "${FTTR_LUCI_BRANCH}")

          if [ "$R1" = "private" ] || [ "$R2" = "private" ]; then
            NEED=true
          fi
          echo "need_token=$NEED" >> "$GITHUB_OUTPUT"
          echo "backend=$R1" >> "$GITHUB_OUTPUT"
          echo "luci=$R2" >> "$GITHUB_OUTPUT"

          # 只把「私有」的仓库放进令牌白名单。
          # ⚠ 踩过的坑：repositories 里写了一个 App 没安装的仓库（哪怕是公开仓库），
          #   令牌申请直接 422 —— "at least one repository that does not exist or
          #   is not accessible to the parent installation"。公开仓库本来就不需要
          #   令牌，列进去纯属给自己找麻烦。
          TOKEN_REPOS=""
          add_repo() {  # add_repo <public|private> <owner/repo>
            [ "$1" = "private" ] || return 0
            local name="${2#*/}"   # 去掉 owner/ 前缀，只留仓库名
            if [ -z "$TOKEN_REPOS" ]; then TOKEN_REPOS="$name"; else TOKEN_REPOS="$TOKEN_REPOS,$name"; fi
          }
          add_repo "$R1" "${PRIVATE_REPO}"
          add_repo "$R2" "${FTTR_LUCI_REPO}"
          echo "token_repos=$TOKEN_REPOS" >> "$GITHUB_OUTPUT"
          echo "  令牌白名单（仅私有仓库）：${TOKEN_REPOS:-（空）}"
          echo "结论：$( [ "$NEED" = true ] && echo '至少一个需要凭证 → 申请 App 令牌' || echo '全部公开 → 跳过取凭证' )"
          echo "--- 凭证配置情况（只看有没有配，不打印值）---"
          echo "  App 凭证 (PRIVATE_SOURCE_APP_ID + _PRIVATE_KEY): ${HAS_APP_CREDS}"
          echo "  PAT 回退 (PRIVATE_REPO_TOKEN / FTTR_TOKEN):      ${HAS_PAT}"
          if [ "$NEED" = true ] && [ "${HAS_APP_CREDS}" != "true" ] && [ "${HAS_PAT}" != "true" ]; then
            echo "::error::仓库需要凭证但两种凭证都没配 —— 后面的 Setup 步骤会失败退出"
          fi

      # 只在探测到「确实有私有仓库」时才申请令牌：PRIVATE_REPO=none、
      # 非 HM2004-DU 机型、或仓库已转公开，都直接跳过，免得没装 App 的
      # fork 一上来就红。
      - name: Create private source token
        id: private-source-token
        # 少了 HAS_APP_CREDS 这个门，Secrets 没配时 action 会直接抛
        # "Input required and not supplied: app-id" 炸掉整个 job。
        # 加上之后：没配 App 就跳过，由后面的 Setup 步骤回退到 PAT。
        if: ${{ steps.probe.outputs.need_token == 'true' && env.HAS_APP_CREDS == 'true' }}
        # ⚠ 关键：拿不到令牌不能炸掉整个 job。
        #   典型场景——仓库私有但 App 没装到它（或 repositories 里混进了
        #   公开但未安装的仓库）→ action 报 422，重试 4 次后失败。
        #   设了 continue-on-error 之后，Setup 步骤会看到空的 APP_TOKEN
        #   并自动回退到 PAT，构建不至于卡死在编译前。
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          # v1 用 app-id（App 的「App ID」）；升到 v3 要改名为 client-id 并且
          # 填的是「Client ID」，两者不是同一个值，别直接换版本号了事。
          app-id: ${{ secrets.PRIVATE_SOURCE_APP_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          # 只列探测判定为私有的仓库（逗号分隔），公开仓库不进白名单
          repositories: ${{ steps.probe.outputs.token_repos }}

      - name: Prepare private Git authentication
        if: ${{ steps.probe.outputs.need_token == 'true' && (env.HAS_APP_CREDS == 'true' || env.HAS_PAT == 'true') }}
        run: |
          install -m 700 "$GITHUB_WORKSPACE/scripts/git_askpass.sh" "$RUNNER_TEMP/git-askpass"
          echo "GIT_ASKPASS=$RUNNER_TEMP/git-askpass" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Setup private repo credentials
        id: private_repo
        env:
          APP_TOKEN: ${{ steps.private-source-token.outputs.token }}
          SEC_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SEC_TOKEN_LEGACY: ${{ secrets.FTTR_TOKEN }}
        run: |
          # 本次不拉私有仓库：关掉 FTTR 全家桶（开关支持环境变量覆盖）
          if [ "${PRIVATE_REPO}" = "none" ]; then
            echo "ADD_FTTR=false" >> "$GITHUB_ENV"
            echo "⚠ PRIVATE_REPO=none —— 跳过私有仓库，kmod-h3c-fmcs / h3c-fttr-tools / h3c-fmcs-firmware / luci-app-fttr 都不会编进固件"
            exit 0
          fi

          # 只有 HM2004-DU 会拉私库（diy-part1.sh 的 FTTR_PROFILE 判定）
          if [ "${PROFILE}" != "h3c_hm2004-du" ]; then
            echo "ℹ PROFILE=${PROFILE} —— 不涉及 FTTR 私库，跳过凭证注入"
            exit 0
          fi

          # 探测已认定两个仓库都能匿名读 → 一个凭证都不注入
          if [ "${{ steps.probe.outputs.need_token }}" != "true" ]; then
            echo "✅ 探测结论：${PRIVATE_REPO} / ${FTTR_LUCI_REPO} 均可匿名访问（公开仓库），不注入任何凭证"
            exit 0
          fi

          # 日志脱敏：URL 里的 user:token@ 一律替换成 ***@
          sanitize() { sed -E 's#://[^@/]+@#://***@#g'; }

          # 1) 选凭证：App 安装令牌 > PAT Secret
          if [ -n "${APP_TOKEN}" ]; then
            TOKEN="${APP_TOKEN}"; SRC="GitHub App 安装令牌"
          elif [ "${HAS_APP_CREDS}" = "true" ] && [ "${{ steps.probe.outputs.need_token }}" = "true" ]; then
            echo "::warning::App 凭证已配置，但令牌申请失败（见上一步日志）。"
            echo "  最常见原因：App 的 Install App → Only select repositories 里没勾上探测判定为私有的仓库，"
            echo "  或 repositories 白名单混进了未安装的仓库（HTTP 422）。回退到 PAT。"
          elif [ -n "${SEC_TOKEN}" ]; then
            TOKEN="${SEC_TOKEN}"; SRC="Secret PRIVATE_REPO_TOKEN"
          elif [ -n "${SEC_TOKEN_LEGACY}" ]; then
            TOKEN="${SEC_TOKEN_LEGACY}"; SRC="Secret FTTR_TOKEN（旧名）"
          else
            echo "::error::探测到私有仓库，但没有任何可用凭证（GitHub App / PRIVATE_REPO_TOKEN / FTTR_TOKEN 全空）。"
            echo "  推荐：Secrets 配 PRIVATE_SOURCE_APP_ID + PRIVATE_SOURCE_APP_PRIVATE_KEY"
            echo "        （GitHub App 装到下面标为 private 的仓库，Permissions → Contents: Read-only）"
            echo "  回退：Secrets 配 PRIVATE_REPO_TOKEN（PAT，需对私有仓库有 Contents 读权限）"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "ℹ 凭证来源：$SRC"

          # 令牌落到一个 600 的文件里给 askpass 读：不进 git config、不进命令行
          TOKEN_FILE="$RUNNER_TEMP/gh_token"
          printf '%s' "$TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"

          # ⚠ 写 $GITHUB_ENV 只对【后续步骤】生效，本步骤当前进程看不见！
          #   下面紧跟的带凭证复检就在本步骤里跑，所以必须同时 export 一份，
          #   否则 askpass 拿到空的 GH_TOKEN_FILE，报
          #   "unable to read askpass response ... terminal prompts disabled"。
          #   GIT_ASKPASS 是上一步写进 GITHUB_ENV 的，本步骤已经能读到。
          export GH_TOKEN_FILE="$TOKEN_FILE"
          export GIT_ASKPASS="${GIT_ASKPASS:-$RUNNER_TEMP/git-askpass}"
          echo "GH_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"

          # 自检：直接问一次 askpass，拿不到令牌就别往下跑（省得git 报黑盒错误）
          if ! ASK=$(GIT_ASKPASS="$GIT_ASKPASS" "$GIT_ASKPASS" "Password for 'https://github.com':" 2>/dev/null) \
               || [ -z "$ASK" ]; then
            echo "::error::askpass 自检失败：拿不到令牌（令牌文件为空？askpass 脚本没可执行位？）"
            exit 1
          fi
          echo "  askpass 自检通过（令牌长度 ${#ASK}，值不打印）"

          # checkout 注入的 extraheader 会直接盖掉 askpass 的凭证（本地 config 优先级最高）。
          # persist-credentials: false 已让 checkout 不再写入，这里双保险清一下。
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local  --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # 3) 带凭证复检：只复检「探测判定为私有」的仓库，公开的不碰
          #    （公开仓库带令牌也能过，但没必要，且会掩盖配置问题）
          FAIL=0
          for pair in "${{ steps.probe.outputs.backend }}:${PRIVATE_REPO}:${PRIVATE_REPO_BRANCH}" \
                      "${{ steps.probe.outputs.luci }}:${FTTR_LUCI_REPO}:${FTTR_LUCI_BRANCH}"; do
            vis="${pair%%:*}";     rest="${pair#*:}"
            repo="${rest%%:*}";    br="${rest#*:}"
            [ "$vis" = "private" ] || continue

            if ERR=$(git ls-remote --exit-code --heads "https://github.com/${repo}" \
                       "refs/heads/${br}" 2>&1); then
              echo "✅ 凭证可用：${repo} (分支 ${br})"
              continue
            fi

            FAIL=1
            echo "::error::仓库 ${repo} 的分支 ${br} 带凭证访问失败"
            echo "--- git 原始错误（已脱敏）---"
            printf '%s\n' "$ERR" | sanitize

            # 4) 用 API 把失败原因分开报（App 令牌和 PAT 的排查路径完全不同）
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer $TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/${repo}")
            echo "--- API /repos/${repo} → HTTP $CODE ---"
            case "$CODE" in
              200) echo "ℹ API 可见但 git 取不到：多半是分支 ${br} 不存在（注意大小写）" ;;
              404) echo "ℹ 404：App 没安装到 ${repo}（App → Install App → Only select repositories 里要有它），或上一步 repositories 白名单漏了；走 PAT 则是 Repository access 没选中该仓库 / 只勾了默认的 Metadata（读不了 git）" ;;
              401) echo "ℹ 401：令牌无效或已过期（App 安装令牌只有 1 小时、不跨 job 复用），或私钥与 App ID 不匹配" ;;
              403) echo "ℹ 403：权限不足或限流，确认 App 的 Contents 权限至少是 Read-only" ;;
              *)   echo "ℹ HTTP $CODE：见上方 git 原始错误" ;;
            esac
          done

          exit "$FAIL"

      # =========================================================
      # 3. dl 下载缓存
      # =========================================================
      - name: Cache dl directory
        if: env.USE_DL_CACHE == 'true'
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: /workdir/openwrt/dl
          # 按分支 + 周号：同一周内复用同一条目。
          # 原先用 github.run_number → 每次运行都 save 一份新副本，
          # 10GB 配额会被迅速刷满并淘汰掉有用的旧缓存。
          key: ponwrt-dl-${{ env.SOURCE }}-${{ github.event.inputs.branch || 'master' }}-${{ steps.resolve.outputs.week }}
          restore-keys: |
            ponwrt-dl-${{ env.SOURCE }}-${{ github.event.inputs.branch || 'master' }}-
          # 关键：即使后面编译失败也要保住已下载的源码包
          save-always: true

      # =========================================================
      # 4. 更新并安装 Feeds
      # =========================================================
      - name: Update & install feeds
        run: |
          cd "$BUILD_ROOT/openwrt"
          if [ -n "${FEEDS_CONF}" ] && [ -e "$GITHUB_WORKSPACE/${FEEDS_CONF}" ]; then
            cp "$GITHUB_WORKSPACE/${FEEDS_CONF}" feeds.conf.default
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # =========================================================
      # 5. diy-part1.sh —— 拉取可选插件
      # =========================================================
      - name: Pull optional plugins (diy-part1.sh)
        run: |
          cd "$BUILD_ROOT/openwrt"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"


      # =========================================================
      # 6. 加载 .config —— 源码基座 defconfig 打底 + 机型精简配置追加
      # =========================================================
      - name: Load custom configuration
        run: |
          cd "$BUILD_ROOT/openwrt"
          [ -e "$GITHUB_WORKSPACE/files" ] && cp -r "$GITHUB_WORKSPACE/files" files

          # git 可能在 checkout 时丢掉 exec bit，rpcd 就执行不了 tempinfo
          [ -d files/sbin ] && chmod +x files/sbin/* 2>/dev/null
          [ -d files/etc/uci-defaults ] && chmod +x files/etc/uci-defaults/* 2>/dev/null

          # =========================================================
          # 关键：先用源码自带的 configs/<soc>.config 基座打底
          # 精简配置只写差异，很多符号（如 LUCI_LANG_zh_Hans、TAR_*、
          # MAC80211_*）是 tristate 且无 default，默认 n。若直接拿精简
          # 配置当 .config，defconfig 会把它们重置成 n，导致中文包丢失。
          # 先铺基座再追加差异，基座所有非默认值都保留，后写的覆盖先写的。
          # =========================================================
          if [ -f "configs/${SOC}.config" ]; then
            cp "configs/${SOC}.config" .config
            echo "✅ 已用源码基座 defconfig 打底: configs/${SOC}.config"
          else
            : > .config
            echo "::warning::源码中无 configs/${SOC}.config，仅用精简配置"
          fi

          # 再追加工型精简配置（其中的 =y / is not set 会覆盖基座）
          if [ -e "$GITHUB_WORKSPACE/${CONFIG_FILE}" ]; then
            cat "$GITHUB_WORKSPACE/${CONFIG_FILE}" >> .config
            echo "✅ 已追加机型配置: ${CONFIG_FILE}"
          elif [ -e "$GITHUB_WORKSPACE/configs/${SOC}.config" ]; then
            cat "$GITHUB_WORKSPACE/configs/${SOC}.config" >> .config
            echo "✅ 已追加 SoC 通用配置"
          else
            echo "::error::找不到机型配置 ${CONFIG_FILE}"
            exit 1
          fi

      # =========================================================
      # 7. 按机型裁剪: 只保留一个 TARGET_DEVICE
      # =========================================================
      - name: Apply device profile
        run: |
          cd "$BUILD_ROOT/openwrt"

          if [ "${PROFILE}" = "all" ]; then
            echo "全机型编译，不做裁剪"
          else
            # 清掉所有设备选中项（含 is not set 行），再单独打开目标机型
            sed -i '/CONFIG_TARGET_DEVICE_/d; /^CONFIG_TARGET_MULTI_PROFILE=/d' .config
            {
              echo "CONFIG_TARGET_MULTI_PROFILE=y"
              echo "CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y"
              echo "CONFIG_TARGET_DEVICE_PACKAGES_airoha_${SOC}_DEVICE_${PROFILE}=\"\""
            } >> .config
            echo "已裁剪为: CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y"
          fi

      # =========================================================
      # 8. diy-part2.sh —— 时区改为中国、写入固件版本后缀
      #     ★ 加密可选包就在这一步注入（diy-part2.sh 末尾 source 我们的脚本）。
      #       必须早于步骤 9 的 make defconfig，否则内核符号写完就被
      #       defconfig 重新展开覆盖掉了。
      # =========================================================
      - name: Set timezone to China (diy-part2.sh)
        run: |
          cd "$BUILD_ROOT/openwrt"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          FW_AUTHOR="$FW_AUTHOR" FW_BUILD_TIME="$FW_BUILD_TIME" FW_DESC_SUFFIX="$FW_DESC_SUFFIX" \
          WIFI_5G_COUNTRY="$WIFI_5G_COUNTRY" WIFI_5G_CHANNEL="$WIFI_5G_CHANNEL" \
          WIFI_5G_HTMODE="$WIFI_5G_HTMODE" WIFI_5G_FALLBACK="$WIFI_5G_FALLBACK" \
            "$GITHUB_WORKSPACE/$DIY_P2_SH"

          # 可选包是否被 defconfig 接受，要等步骤 9 之后才知道；
          # 这里先记下期望值，步骤 9 末尾做一次对照。
          echo "WANT_ARM64CE=${OPT_CRYPTO_ARM64CE}" >> "$GITHUB_ENV"
          echo "WANT_CHACHA=${OPT_CRYPTO_CHACHA}"   >> "$GITHUB_ENV"
          echo "WANT_EIP93=${OPT_CRYPTO_EIP93}"     >> "$GITHUB_ENV"

      # =========================================================
      # 9. defconfig + 生成工具链缓存 Key + 校验机型
      #     【唯一一次 defconfig】后续步骤不再调用，避免 .config 被重新展开、
      #     机型配置里显式写死的选择被静默剔除
      # =========================================================
      - name: Generate toolchain cache key
        id: cache-key
        run: |
          cd "$BUILD_ROOT/openwrt"

          # diffconfig(精简配置) 必须 defconfig 展开；保留末尾输出便于排查
          echo "===== make defconfig ====="
          make defconfig 2>&1 | tail -5

          # =========================================================
          # 关键包校验：defconfig 会把 feeds 里不存在的包静默剔除，
          # 这里显式确认 PON 核心链路还在，否则编出来光口不通
          # =========================================================
          MISSING=""
          for p in kmod-airoha-xpon kmod-airoha-pon-frontend airoha-pond airoha-ponctl luci-app-pon; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::以下关键包在 defconfig 后未启用，检查 feeds 是否完整:$MISSING"
            exit 1
          fi
          echo "✅ PON 关键包校验通过"

          # =========================================================
          # 状态插件校验：第三方包若在 package/custom 里缺失，
          # defconfig 会把 .config 里的 =y 当无效符号静默删除，
          # 编完发现界面里没这个菜单时才察觉就晚了
          # =========================================================
          OPT_MISS=""
          for p in luci-app-airoha-npu luci-app-pon-status luci-app-natmode; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              OPT_MISS="$OPT_MISS $p"
              echo "::warning::${p} 在 defconfig 后未启用"
              echo "  --- 诊断 ---"
              echo "  1) 包目录: $([ -d "package/custom/${p}" ] && echo '存在' || echo '不存在')"
              echo "  2) feeds 链接: $([ -e "package/feeds/custom/${p}" ] && echo '存在' || echo '不存在')"
              echo "  3) .packageinfo 记录: $(grep -c "Package: ${p}\$" tmp/.packageinfo 2>/dev/null || echo 0)"
              echo "  4) feeds.conf 中 custom: $(grep -cE '^src-link[[:space:]]+custom' feeds.conf.default 2>/dev/null || echo 0)"
              # 直接查询 buildroot 是否认识这个包
              echo "  5) 包符号探测:"
              grep -A3 "^Package: ${p}\$" tmp/.packageinfo 2>/dev/null | head -6 || echo "     (无记录)"
            fi
          done
          if [ -n "$OPT_MISS" ]; then
            echo "::error::状态插件缺失:$OPT_MISS 请检查 diy-part1.sh 的 clone / 拷贝是否成功"
            exit 1
          fi
          echo "✅ 状态插件校验通过"

          # 中文包（po 注入后才存在，缺失只警告不阻断）
          if ! grep -q "^CONFIG_PACKAGE_luci-i18n-airoha-npu-zh-cn=y" .config; then
            echo "::warning::luci-i18n-airoha-npu-zh-cn 未启用（po/zh_Hans 未注入？界面将为英文）"
          fi

          # =========================================================
          # 加密可选包复核（只警告不阻断）
          #   defconfig 会把源码树里不存在的包当无效符号静默删掉。
          #   PonWrt 基于 ImmortalWrt，kmod-crypto-hw-eip93 是否随
          #   target/linux 的 crypto.mk 一起带过来取决于内核版本：
          #   ≥6.18 走主线 inside-secure/eip93，<6.18 走 mtk-eip93，
          #   两种都没有就整个包不存在。这里如实报，别让"编译成功"骗过去。
          # =========================================================
          echo "===== 加密可选包复核 ====="
          if [ "${WANT_EIP93}" = "1" ] && ! grep -q "^CONFIG_PACKAGE_kmod-crypto-hw-eip93=y" .config; then
            echo "::warning::kmod-crypto-hw-eip93 未编入 —— 当前源码树不带该包（内核版本或 target 不含 EIP93）。不影响其余构建。"
          fi
          if [ "${WANT_CHACHA}" = "1" ]; then
            for p in kmod-crypto-lib-chacha20 kmod-crypto-chacha20poly1305; do
              grep -q "^CONFIG_PACKAGE_${p}=y" .config \
                && echo "  ✅ ${p}" \
                || echo "::warning::${p} 未编入（源码树无此包符号，ChaCha 加速不生效）"
            done
          fi

          # 内核符号复核：目标 kernel config 里应能看到我们写进去的项
          KCFG="$(ls target/linux/airoha/${SUBTARGET:-${SOC}}/config-* 2>/dev/null | head -1)"
          if [ "${WANT_ARM64CE}" = "1" ] && [ -n "$KCFG" ]; then
            if grep -q '^CONFIG_CRYPTO_AES_ARM64=y' "$KCFG"; then
              echo "  ✅ 内核符号已写入 ${KCFG}"
            else
              echo "::warning::${KCFG} 里没有 CONFIG_CRYPTO_AES_ARM64 —— diy-part2-crypto.sh 未生效（没被 source？路径不对？）"
            fi
          fi

          # 机型校验: 机型名写错时直接失败，避免静默全编译
          if [ "${PROFILE}" != "all" ]; then
            if ! grep -q "^CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y" .config; then
              echo "::error::机型 ${PROFILE} 在 ${SOC} 下不存在，请检查 profile 名称"
              exit 1
            fi
            echo "机型校验通过: ${PROFILE}"
          fi

          TARGET=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
          SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)

          TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
            -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)

          CACHE_KEY="ponwrt-toolchain-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}"
          CACHE_PREFIX="ponwrt-toolchain-${TARGET}-${SUBTARGET}"

          echo "CACHE_KEY=$CACHE_KEY"     >> "$GITHUB_OUTPUT"
          echo "CACHE_PREFIX=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "缓存 Key  : $CACHE_KEY"
          echo "缓存前缀  : $CACHE_PREFIX"
          echo "========================================"

      # =========================================================
      # 9.5 下载工具链源码 —— 必须在编工具链之前
      #     报错 "Can't open dl/musl-1.2.6.tar.gz" 就是这一步缺失导致的：
      #     make toolchain/install 不会自动补下载，只会去解压 dl 里已有的包
      # =========================================================
      - name: Download toolchain sources
        run: |
          cd "$BUILD_ROOT/openwrt"

          for i in 1 2 3; do
            echo "===== 第 $i 次尝试: tools/toolchain download ====="
            if make tools/download toolchain/download -j8; then
              echo "✅ 下载完成"
              break
            fi
            echo "::warning::第 $i 次下载失败，5 秒后重试"
            sleep 5
          done

          # 清理下载失败残留的小文件，否则解压时报 "does not look like a tar archive"
          echo "--- 清理损坏的下载包 ---"
          find dl -size -1024c -type f -exec ls -l {} \; 2>/dev/null
          find dl -size -1024c -type f -exec rm -f {} \; 2>/dev/null

          echo "dl 目录共 $(ls -1 dl 2>/dev/null | wc -l) 个文件"
          ls -lh dl 2>/dev/null | head -20

          # 工具链三大件强校验，缺了直接失败，别等到解压时才报
          MISS=""
          for pat in "musl-*.tar.gz" "gcc-*" "binutils-*"; do
            if ! ls dl/$pat >/dev/null 2>&1; then
              MISS="$MISS $pat"
            fi
          done
          if [ -n "$MISS" ]; then
            echo "::error::工具链源码缺失:$MISS 请检查网络或 dl 缓存"
            exit 1
          fi
          echo "✅ 工具链源码校验通过"

      # =========================================================
      # 10. 恢复工具链 —— 第一优先 actions/cache
      # =========================================================
      - name: Restore toolchain from actions/cache
        if: env.IGNORE_CACHE != 'true'
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: |
            ${{ env.BUILD_ROOT }}/openwrt/staging_dir/host*
            ${{ env.BUILD_ROOT }}/openwrt/staging_dir/tool*
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}

      # =========================================================
      # 11. 恢复工具链 —— 第二优先 Release 备份
      # =========================================================
      - name: Restore toolchain from Release backup
        if: env.IGNORE_CACHE != 'true' && steps.cache-restore.outputs.cache-hit != 'true'
        id: release-restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$BUILD_ROOT/openwrt"

          CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
          ASSET_NAME="${CACHE_KEY}.tzst"

          if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "toolchain-cache Release 不存在，首次运行"
            exit 0
          fi

          # tzst 需要 unzstd；runner 未预装时先装，避免「假命中」后解压失败
          which unzstd >/dev/null 2>&1 || sudo -E apt-get -yqq install zstd >/dev/null 2>&1 || true

          if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" \
               --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET_NAME"; then
            echo "从 Release 下载工具链: $ASSET_NAME"
            gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET_NAME" -D .
            tar -I unzstd -xf "$ASSET_NAME" || tar -xf "$ASSET_NAME"
            rm -f "$ASSET_NAME"
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Release 中无匹配缓存"
          fi

      # =========================================================
      # 12. 处理工具链
      # =========================================================
      - name: Handle toolchain
        id: toolchain
        run: |
          cd "$BUILD_ROOT/openwrt"

          CACHE_HIT="${{ steps.cache-restore.outputs.cache-hit }}"
          RELEASE_HIT="${{ steps.release-restore.outputs.restored }}"
          [ "$IGNORE_CACHE" = "true" ] && CACHE_HIT="" && RELEASE_HIT=""

          if [ "$CACHE_HIT" = "true" ]; then
            echo "actions/cache 命中，跳过工具链编译"
            echo "need_build=false"       >> "$GITHUB_OUTPUT"
            echo "need_save_cache=false"  >> "$GITHUB_OUTPUT"
            echo "need_save_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_HIT" = "true" ]; then
            echo "Release 缓存命中，回写 actions/cache"
            echo "need_build=false"       >> "$GITHUB_OUTPUT"
            echo "need_save_cache=true"   >> "$GITHUB_OUTPUT"
            echo "need_save_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "无可用缓存，开始编译工具链..."
            make tools/install -j"$(nproc)" || make tools/install -j1 V=s || { echo "tools 编译失败"; exit 1; }
            make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s || { echo "toolchain 编译失败"; exit 1; }
            echo "need_build=true"        >> "$GITHUB_OUTPUT"
            echo "need_save_cache=true"   >> "$GITHUB_OUTPUT"
            echo "need_save_release=true" >> "$GITHUB_OUTPUT"
          fi

          # 后续 make 跳过工具链重编：touch 对应 stamp 而非 sed 改写 Makefile，
          # 避免上游调整缩进/换行后失效、并避免污染工作区。
          touch toolchain/stamp-compile tools/stamp-compile 2>/dev/null || true

      # =========================================================
      # 12.5 ccache 补装（仅 USE_CCACHE=true 时执行）
      #
      #   ccache 二进制由 tools/ccache 安装到 staging_dir/host/bin。
      #   tools/Makefile：
      #     ifneq ($(CONFIG_CCACHE)$(CONFIG_SDK),)
      #       tools-y += ccache xxhash
      #   即只有 CONFIG_CCACHE 生效时才会编入。
      #
      #   问题场景：工具链缓存命中 → 上面跳过 make tools/install →
      #   ccache 不在缓存里（缓存是未开 ccache 时建的）→
      #   rules.mk 的 TARGET_CC:= ccache $(TARGET_CC) 找不到二进制：
      #     /bin/sh: 1: .../staging_dir/host/bin/ccache: not found (Error 127)
      #
      #   故这里单独补装 tools/ccache，并在失败时自动关闭 ccache 继续编译，
      #   绝不因 ccache 让整次构建失败。
      # =========================================================
      - name: Setup ccache (opt-in)
        if: env.USE_CCACHE == 'true'
        run: |
          cd "$BUILD_ROOT/openwrt"

          # 1) 确保 .config 里有 CONFIG_CCACHE=y（rules.mk 据此启用 ccache）
          sed -i '/^CONFIG_CCACHE=/d; /^# CONFIG_CCACHE is not set/d' .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig >/dev/null 2>&1 || true

          # 2) 缺二进制就补装（ccache 依赖 xxhash → cmake，首次会多花几分钟）
          if [ ! -x staging_dir/host/bin/ccache ]; then
            echo "ccache 缺失，补装 tools/ccache ..."
            if ! make tools/ccache/install -j"$(nproc)"; then
              echo "::warning::tools/ccache 安装失败，自动关闭 ccache 继续编译"
              sed -i 's/^CONFIG_CCACHE=y/# CONFIG_CCACHE is not set/' .config
            fi
          fi

          # 3) 最终确认：仍然不可用就彻底关掉，避免 Error 127
          if ! grep -q '^CONFIG_CCACHE=y' .config; then
            echo "ccache: 已关闭"
          elif [ -x staging_dir/host/bin/ccache ]; then
            echo "ccache: 已启用 ($(staging_dir/host/bin/ccache --version | head -1))"
          else
            echo "::warning::ccache 二进制仍缺失，强制关闭"
            sed -i 's/^CONFIG_CCACHE=y/# CONFIG_CCACHE is not set/' .config
          fi

      # =========================================================
      # 13. 保存工具链到 actions/cache
      # =========================================================
      - name: Save toolchain to actions/cache
        uses: actions/cache/save@v5
        if: steps.toolchain.outputs.need_save_cache == 'true'
        # 即使固件编译失败也要保住工具链，避免下次冷启动
        continue-on-error: true
        with:
          path: |
            ${{ env.BUILD_ROOT }}/openwrt/staging_dir/host*
            ${{ env.BUILD_ROOT }}/openwrt/staging_dir/tool*
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}

      # =========================================================
      # 14. 保存工具链到 Release 备份
      # =========================================================
      - name: Save toolchain to Release backup
        if: steps.toolchain.outputs.need_save_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$BUILD_ROOT/openwrt"

          CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
          CACHE_PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"

          tar -I zstdmt -cf "${CACHE_KEY}.tzst" staging_dir/host* staging_dir/tool*
          ls -lh "${CACHE_KEY}.tzst"

          gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" \
              --title "Toolchain Cache" --notes "自动生成的工具链缓存，请勿手动删除" --latest=false

          # 删除同平台旧缓存
          gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[].name' 2>/dev/null | grep "^${CACHE_PREFIX}" | while read -r old; do
              gh release delete-asset toolchain-cache "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
            done

          gh release upload toolchain-cache "${CACHE_KEY}.tzst" --repo "$GITHUB_REPOSITORY" --clobber
          rm -f "${CACHE_KEY}.tzst"

      # =========================================================
      # 15. ccache 缓存
      # =========================================================
      - name: Cache ccache
        if: env.USE_CCACHE == 'true' && env.BUILD_SCOPE != 'toolchain-only'
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ env.BUILD_ROOT }}/openwrt/.ccache
          key: ponwrt-ccache-${{ env.SOC }}-${{ steps.resolve.outputs.week }}
          restore-keys: |
            ponwrt-ccache-${{ env.SOC }}-

      # =========================================================
      # 16. SSH 调试（仅受控场景开启）
      # =========================================================
      - name: SSH connection to Actions
        uses: mxschmitt/action-tmate@v3
        # 原条件 contains(github.event.action, 'ssh') 对 workflow_dispatch 永假
        # （event.action 恒为 "workflow_dispatch"），叠加 ref==refs/heads/main
        # （本 workflow 在 FTTR 分支运行）后，ssh=true 从来不会触发。
        # 保留 owner 校验：调试入口只对仓库所有者开放。
        if: >-
          github.event.inputs.ssh == 'true'
          && github.actor == github.repository_owner

      # =========================================================
      # 17. 下载软件包（defconfig 已在步骤 9 执行，此处不再重复）
      # =========================================================
      - name: Download packages
        id: package
        if: env.BUILD_SCOPE != 'toolchain-only'
        run: |
          cd "$BUILD_ROOT/openwrt"
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试: make download ====="
            if make download -j8; then break; fi
            sleep 5
          done
          # 清理下载失败残留的小文件
          find dl -size -1024c -type f -exec ls -l {} \; 2>/dev/null
          find dl -size -1024c -type f -exec rm -f {} \; 2>/dev/null
          echo "dl 目录共 $(ls -1 dl 2>/dev/null | wc -l) 个文件"

      # =========================================================
      # 18. 编译固件
      #     并发数按可用内存动态计算：每个 cc1 约 1.5-2G RSS，
      #     4 核 16G runner 上 -j8 易触发 OOM-killer 杀 cc1。
      # =========================================================
      - name: Compile the firmware
        id: compile
        if: env.BUILD_SCOPE != 'toolchain-only'
        run: |
          cd "$BUILD_ROOT/openwrt"
          # 可用内存(MiB) / 2GiB 每 job，下限 1、上限 nproc
          JOBS=$(awk -v p="$(nproc)" '/^MemAvailable:/{m=int($2/2097152)+1} END{print m<p?m:p}' /proc/meminfo)
          JOBS=$(( JOBS < 1 ? 1 : JOBS ))
          echo "开始编译 (${JOBS} 线程) / 机型: ${PROFILE}"
          df -hT /

          if make -j"${JOBS}"; then
            echo "多线程编译成功"
          elif make -j1; then
            echo "单线程编译成功"
          elif make -j1 V=s; then
            echo "单线程详细日志编译成功"
          else
            echo "编译失败"
            exit 1
          fi

          df -hT /
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      # =========================================================
      # 19. 空间检查
      # =========================================================
      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      # =========================================================
      # 20. 上传 bin 目录
      # =========================================================
      - name: Upload bin directory
        uses: actions/upload-artifact@v5
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          # 必须用绝对路径：openwrt/bin 是 $GITHUB_WORKSPACE 下的符号链接
          # （Clone source code 步骤 ln -sf 建的），upload-artifact 遍历
          # 符号链接目录不可靠，可能传一个空包。
          path: ${{ env.BUILD_ROOT }}/openwrt/bin

      # =========================================================
      # 21. 整理并上传固件
      # =========================================================
      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
        run: |
          cd "$BUILD_ROOT"/openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v5
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      # =========================================================
      # 22. 生成 Release 说明
      # =========================================================
      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        run: |
          # 没产出固件就别发空 Release
          if [ -z "$FIRMWARE" ] || [ -z "$(ls -A "$FIRMWARE" 2>/dev/null)" ]; then
            echo "::warning::固件目录为空，跳过 Release"
            exit 0
          fi

          # 固定 tag：机型 + 分支，不含时间戳、不含作者
          # 同一机型/分支再次编译时，softprops/action-gh-release 会更新
          # 这个已存在的 Release（同名固件自动覆盖），不会新建版本。
          RELEASE_TAG=$(echo "${DEVICE_NAME}-${REPO_BRANCH}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          touch release.txt
          {
            echo "## PonWrt 自动编译固件"
            echo ""
            echo "### 编译信息"
            echo "| 项目 | 详情 |"
            echo "|------|------|"
            echo "| 机型 | \`${PROFILE}\` |"
            echo "| SoC | \`${SOC}\` |"
            echo "| 作者 | \`${FW_AUTHOR}\` |"
            echo "| 源码 | ${REPO_URL} |"
            echo "| 分支 | \`${REPO_BRANCH}\` |"
            echo "| 提交 | \`$(cd "$BUILD_ROOT"/openwrt && git rev-parse --short HEAD)\` |"
            echo "| 编译时间 | $(date '+%Y-%m-%d %H:%M:%S') (Shanghai) |"
            echo "| 加密加速 | ARM64CE=${OPT_CRYPTO_ARM64CE} / ChaCha=${OPT_CRYPTO_CHACHA} / EIP93=${OPT_CRYPTO_EIP93} |"
            echo ""
            echo "### 固件文件校验"
            echo '```'
            (cd "$FIRMWARE" && sha256sum * 2>/dev/null | grep -vE "sha256sums|packages")
            echo '```'
            echo ""
            echo "---"
            echo "> 本 Release 为滚动发布页，仅保留最新一次编译产物。"
            echo "> 安装前请用 AN758x-Stock2UBI 备份原厂 flash，刷机后恢复 PON/校准数据。"
          } >> release.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          make_latest: true
          # 不同机型产物后缀不同，缺哪种都别让这一步失败
          fail_on_unmatched_files: false
          files: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.ubi
            ${{ env.FIRMWARE }}/*.img
            ${{ env.FIRMWARE }}/*.img.gz
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.fit
            ${{ env.FIRMWARE }}/*.trx
            ${{ env.FIRMWARE }}/*.tar.gz
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/*.json

      # =========================================================
      # 23. 清理旧记录
      #     仅清理「已上传成功」的运行；失败的运行保留日志便于排错。
      # =========================================================
      - name: Delete workflow runs
        if: steps.compile.outputs.status == 'success'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 7
          keep_minimum_runs: 10

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 10
          delete_tags: true
          delete_tag_pattern: '^${{ env.DEVICE_NAME }}-'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
